name: Deploy Shopme to S3

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  id-token: write   # required for AWS OIDC authentication
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: TEMP - show OIDC identity claims (no secrets)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          jq -R 'split(".") | .[1] | gsub("-";"+") | gsub("_";"/") | . + "===" | @base64d | fromjson | {iss, aud, sub, event_name, ref, repository}' <<< "$TOKEN"
          echo "role secret length: ${#ROLE_ARN} chars, starts with: ${ROLE_ARN:0:13}, ends with: ${ROLE_ARN: -26}"
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync website files to S3 (excluding images/)
        run: |
          aws s3 sync ./site s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude "images/*"

      - name: Sync product images to the images bucket
        run: |
          aws s3 sync ./site/images s3://${{ secrets.IMAGES_BUCKET_NAME }}/images \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
